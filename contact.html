<!DOCTYPE html>
<html lang="en">
<head>

<body>
   <nav class="nav-container">

    <section>   
        <h1 class="contact-me-title">Contact Me</h1>
        <div class="contact-form-container">
            <h2>Feel free to reach out to me through this html form:</h2>
            <form class="contact-form" action="mailto:albert.castillom@gmail.com" method="post" enctype="text/plain" >
                <fieldset>
                    <legend>Contact Info:</legend>
                    <label for="name">Name:</label>
                    <input type="text" id="name" name="name">
                    <label for="email">Email:</label>
                    <input type="text" id="email" name="email">
                    <label for="message">Message:</label>
                    <textarea id="message" name="message"></textarea>
                    <input type="submit" value="Send">
                    <input type="reset" value="Reset">
                </fieldset>
            </form>
        </div>
        <div class="letter-info">
            <h3>Feel free to also send me a letter:</h3>
            <address class="address-info">
                Albert Castillo<br>
                19121 112th Ave NE<br>
                Bothell, WA 98011<br>
                USA
            </address>
        </div>
    </section>
    <Footer class="footer-container">
        <p class="footer-item">by Albert Castillo</p>
    </Footer>
</body>
